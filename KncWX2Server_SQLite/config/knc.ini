; config/knc.ini - KncWX2Server_SQLite single process configuration.
;
; The 2014 deployment ran five executables with one .ini each (LoginServer/config_lg.ini,
; ChannelServer/config_ch.ini, ...). Both files only carried a [Version] block and a [String]
; message table; ports, user limits and the server list lived in code and in the CenterServer
; database. This file keeps the same [Version] contract and adds the settings that used to be
; compiled in, one section per former server.

[Version]
; The client sends KEGS_CONNECT_REQ.m_wstrVersion; KGSUser::OnConnectReq compared it with
; KBaseServer::GetMainVersion() and answered NetError::ERR_CONNECT_00 (= 3) on a mismatch.
Internal Version = 2014031300
OpenTest Version = 2014031300
Service Version  = 2014031300
; Which of the three strings this process announces: internal | opentest | service
UseVersion = internal

[Server]
Name = KncWX2Server
DataDirectory = data
LogFile =
LogLevel = info
; Inserts the sample accounts test/test and gm/gm when the Accounts table is empty.
SeedTestAccounts = true
MigrateOnStart = true
; 0 = run until Ctrl+C; a positive value stops the loop after that many seconds (smoke tests).
ShutdownAfterSeconds = 0

[Database]
Path = data/knc.db
WAL = true
BusyTimeoutMs = 5000
CacheSizeKb = 65536

[Login]
Enable = true
Address = 0.0.0.0
Port = 9000
MaxUser = 500
CheckSequenceNum = false
AuthFailLimit = 100

[Channel]
Enable = true
Address = 0.0.0.0
Port = 9100
MaxUser = 300
CheckSequenceNum = false
AuthFailLimit = 100

[Game]
Enable = true
Address = 0.0.0.0
Port = 9200
MaxUser = 300
CheckSequenceNum = false
AuthFailLimit = 100

[Fep]
Enable = false
Address = 0.0.0.0
Port = 9300
MaxUser = 100

[Center]
Enable = false
Address = 0.0.0.0
Port = 9400
MaxUser = 8

[Global]
Enable = false
Address = 0.0.0.0
Port = 9500
MaxUser = 8

; Channel entries: id | name | ip | master port | NC UDP port | max user | bonus exp % | bonus drop %
[Channels]
Channel0 = 1 | Ch.1 | 127.0.0.1 | 9100 | 9151 | 300 | 0 | 0

; Server set entries handed to the client by EGS_GET_SERVER_SET_DATA_ACK:
; id | name | ip | port | max user
[ServerSet]
Set0 = 1 | Test Server | 127.0.0.1 | 9100 | 300
